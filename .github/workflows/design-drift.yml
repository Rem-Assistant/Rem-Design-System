# Authenticated Figma reference and structure evidence. On pull requests, the workflow and every
# executable file come from the trusted base commit. Only two bounded JSON data files are fetched
# from the exact PR head. Exact-head SwiftUI/Compose renders stay in screenshots.yml.
name: design-drift

on:
  workflow_dispatch:
    inputs:
      pr:
        description: Open draft admitted playground PR requiring read-only Figma evidence
        required: true
        type: string
  pull_request_target:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths:
      - 'tools/playground-ios/**'
      - 'Sources/**'
      - 'compose/**'
      - 'tokens/generated/**'
      - 'docs/contracts/**'
      - 'tools/design-sync/**'
      - 'tools/render-evidence/**'
      - 'code-connect/**'
      - 'figma.*.config.json'
  schedule:
    - cron: '0 7 * * 1'

permissions:
  contents: read
  pull-requests: read

jobs:
  drift:
    runs-on: macos-14
    steps:
      - name: Resolve and constrain manual evidence target
        id: manual
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr }}
        run: |
          set -euo pipefail
          [[ "$PR" =~ ^[1-9][0-9]*$ ]]
          meta=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}")
          test "$(jq -r .state <<<"$meta")" = open
          test "$(jq -r .draft <<<"$meta")" = true
          base_ref=$(jq -r .base.ref <<<"$meta")
          head_ref=$(jq -r .head.ref <<<"$meta")
          case "$base_ref:$head_ref" in
            codex/playground-expansion:agent-factory/playground-issue-*)
              [[ "$head_ref" =~ ^agent-factory/playground-issue-[0-9]+$ ]] ;;
            codex/settings-integration:agent-factory/settings-issue-*)
              [[ "$head_ref" =~ ^agent-factory/settings-issue-[0-9]+$ ]] ;;
            codex/settings-review-contracts:codex/settings-review-native|codex/settings-review-native:codex/settings-review-evidence) ;;
            *) echo '::error::unsupported Settings base/head pair'; exit 1 ;;
          esac
          test "$GITHUB_REF_NAME" = "$base_ref"
          # pull.base.sha can remain the PR creation snapshot after the base
          # branch advances. Resolve the admitted integration ref directly.
          encoded_ref=$(jq -rn --arg ref "$base_ref" '$ref | @uri')
          trusted_base_sha=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${encoded_ref}" --jq .object.sha)
          test "$trusted_base_sha" = "$GITHUB_SHA"
          test "$(jq -r .base.repo.full_name <<<"$meta")" = "$GITHUB_REPOSITORY"
          test "$(jq -r .head.repo.full_name <<<"$meta")" = "$GITHUB_REPOSITORY"
          scopes=$(jq -c '[.labels[].name | select(startswith("delivery-scope:")) | sub("^delivery-scope:"; "")]' <<<"$meta")
          test "$(jq length <<<"$scopes")" = 1
          scope=$(jq -r '.[0]' <<<"$scopes")
          case "$base_ref:$scope" in
            codex/playground-expansion:agenda-suggestions|codex/playground-expansion:onboarding-voice) ;;
            codex/settings-integration:settings-foundation|codex/settings-review-contracts:settings-foundation|codex/settings-review-native:settings-foundation) ;;
            *) echo '::error::unsupported scope/base pair'; exit 1 ;;
          esac
          echo "primary_contract=$scope" >> "$GITHUB_OUTPUT"
          echo "pr=$PR" >> "$GITHUB_OUTPUT"
          echo "head_sha=$(jq -r .head.sha <<<"$meta")" >> "$GITHUB_OUTPUT"
          echo "head_ref=$head_ref" >> "$GITHUB_OUTPUT"
          echo "base_sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          echo "base_ref=$base_ref" >> "$GITHUB_OUTPUT"
      - name: Checkout trusted control plane
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.manual.outputs.base_sha || github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      - name: Select explicit delivery scope
        id: scope
        if: ${{ github.event_name == 'pull_request_target' || github.event_name == 'workflow_dispatch' }}
        env:
          MANUAL_SCOPE: ${{ steps.manual.outputs.primary_contract }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          sys.path.insert(0, 'tools/render-evidence')
          from settings_routing import EXPANSION_SCOPES, validate_manual_pair
          event = json.loads(open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8").read())
          scopes = ([os.environ["MANUAL_SCOPE"]] if os.environ["GITHUB_EVENT_NAME"] == "workflow_dispatch" else [
              label["name"].removeprefix("delivery-scope:")
              for label in event["pull_request"].get("labels", [])
              if label.get("name", "").startswith("delivery-scope:")
          ])
          if len(scopes) > 1:
              raise SystemExit("at most one delivery-scope label is allowed")
          primary = scopes[0] if scopes else ""
          if os.environ["GITHUB_EVENT_NAME"] == "pull_request_target":
              pr = event["pull_request"]
              if primary in EXPANSION_SCOPES or pr["base"]["ref"] == "codex/playground-expansion":
                  validate_manual_pair(pr["base"]["ref"], pr["head"]["ref"], primary)
                  if pr.get("state") != "open" or pr.get("draft") is not True or pr["head"]["repo"]["full_name"] != os.environ["GITHUB_REPOSITORY"] or pr["base"]["repo"]["full_name"] != os.environ["GITHUB_REPOSITORY"]:
                      raise SystemExit("Expansion evidence requires an open same-repository draft")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"primary_contract={primary}\n")
          PY

      - name: Fetch and validate exact-head declarative contract data
        if: ${{ github.event_name == 'pull_request_target' && steps.scope.outputs.primary_contract != '' && steps.scope.outputs.primary_contract != 'settings-foundation' && steps.scope.outputs.primary_contract != 'agenda-suggestions' && steps.scope.outputs.primary_contract != 'onboarding-voice' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_SHA: ${{ steps.manual.outputs.head_sha || github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          node tools/design-sync/fetch-head-data.mjs \
            --api-url="$GITHUB_API_URL" \
            --repo="$HEAD_REPOSITORY" \
            --sha="$HEAD_SHA" \
            --destination="$RUNNER_TEMP/head-data"

      - name: Export Figma evidence
        id: figma-export
        if: ${{ github.event_name != 'pull_request_target' || steps.scope.outputs.primary_contract != '' }}
        continue-on-error: true
        env:
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
          PRIMARY_CONTRACT: ${{ steps.scope.outputs.primary_contract }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" != schedule ]; then
            args=(--references-only)
            if [ -n "$PRIMARY_CONTRACT" ]; then args+=(--primary-contract="$PRIMARY_CONTRACT"); fi
            node tools/design-sync/export-figma.mjs artifacts/figma "${args[@]}"
          else
            node tools/design-sync/export-figma.mjs artifacts/figma
          fi

      - name: Verify live editable Figma structure
        id: structure
        if: ${{ github.event_name != 'pull_request_target' || steps.scope.outputs.primary_contract != '' }}
        continue-on-error: true
        env:
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
          HEAD_SHA: ${{ steps.manual.outputs.head_sha || github.event.pull_request.head.sha || github.sha }}
          PRIMARY_CONTRACT: ${{ steps.scope.outputs.primary_contract }}
        run: |
          set -euo pipefail
          if [ "$PRIMARY_CONTRACT" = settings-foundation ]; then
            node tools/design-sync/verify-settings-structure.mjs \
              --output=artifacts/figma-structure-report.json --head="$HEAD_SHA"
            exit 0
          fi
          case "$PRIMARY_CONTRACT" in
            agenda-suggestions|onboarding-voice)
              node tools/design-sync/verify-playground-structure.mjs \
                --output=artifacts/figma-structure-report.json --head="$HEAD_SHA" \
                --primary-contract="$PRIMARY_CONTRACT"
              exit 0 ;;
          esac
          file_key=$(jq -r .figmaFileKey tools/design-sync/manifest.json)
          contract=tools/design-sync/structure-contract.json
          if [ "$GITHUB_EVENT_NAME" = pull_request_target ]; then
            contract="$RUNNER_TEMP/head-data/structure-contract.json"
          fi
          node tools/design-sync/verify-figma-structure.mjs \
            --output=artifacts/figma-structure-report.json \
            --contract="$contract" \
            --expected-file-key="$file_key" \
            --head="$HEAD_SHA"

      - name: Preserve structure diagnostics
        if: ${{ always() && (github.event_name != 'pull_request_target' || steps.scope.outputs.primary_contract != '') }}
        env:
          HEAD_SHA: ${{ steps.manual.outputs.head_sha || github.event.pull_request.head.sha || github.sha }}
          STRUCTURE_OUTCOME: ${{ steps.structure.outcome }}
        run: |
          if [ ! -s artifacts/figma-structure-report.json ]; then
            mkdir -p artifacts
            python3 - <<'PY'
          import json, os
          from pathlib import Path
          Path("artifacts/figma-structure-report.json").write_text(json.dumps({
              "version": 1,
              "status": "error",
              "head": os.environ["HEAD_SHA"],
              "errors": ["Structure verification stopped before a report could be written."],
              "workflowOutcome": os.environ["STRUCTURE_OUTCOME"],
          }, indent=2) + "\n", encoding="utf-8")
          PY
          fi

      - name: Assemble exact-head Figma reference evidence
        if: ${{ always() && github.event_name != 'schedule' && steps.scope.outputs.primary_contract != '' }}
        env:
          PR: ${{ steps.manual.outputs.pr || github.event.pull_request.number }}
          SHA: ${{ steps.manual.outputs.head_sha || github.event.pull_request.head.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          MANUAL_BASE_SHA: ${{ steps.manual.outputs.base_sha }}
          MANUAL_BASE_REF: ${{ steps.manual.outputs.base_ref }}
          MANUAL_HEAD_REF: ${{ steps.manual.outputs.head_ref }}
          REFERENCE_EXPORT_STATUS: ${{ steps.figma-export.outcome }}
          STRUCTURE_VERIFICATION_STATUS: ${{ steps.structure.outcome }}
          PRIMARY_CONTRACT: ${{ steps.scope.outputs.primary_contract }}
        run: |
          set -euo pipefail
          SCOPE_ARGS=()
          if [ -n "$PRIMARY_CONTRACT" ]; then SCOPE_ARGS=(--primary-contract "$PRIMARY_CONTRACT"); fi
          mkdir -p figma-reference/delivery figma-reference/structure
          python3 tools/render-evidence/stage_references.py \
            --source artifacts/figma --destination figma-reference/reference \
            --contracts tools/render-evidence/contracts.json "${SCOPE_ARGS[@]}"
          cp artifacts/figma-structure-report.json figma-reference/structure/report.json
          if [ "$PRIMARY_CONTRACT" = settings-foundation ]; then
            cp tools/design-sync/settings-structure-contract.json figma-reference/structure/contract.json
            cp tools/design-sync/manifest.json figma-reference/structure/manifest.json
          elif [ "$PRIMARY_CONTRACT" = agenda-suggestions ] || [ "$PRIMARY_CONTRACT" = onboarding-voice ]; then
            cp tools/design-sync/playground-source-contracts.json figma-reference/structure/contract.json
            cp tools/design-sync/manifest.json figma-reference/structure/manifest.json
          else
            cp "$RUNNER_TEMP/head-data/structure-contract.json" figma-reference/structure/contract.json
            cp "$RUNNER_TEMP/head-data/manifest.json" figma-reference/structure/manifest.json
          fi
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path

          root = Path("figma-reference")
          contracts_path = Path("tools/render-evidence/contracts.json")
          head_contract = root / "structure/contract.json"
          head_manifest = root / "structure/manifest.json"
          structure_report = root / "structure/report.json"
          media = {
              path.relative_to(root).as_posix(): hashlib.sha256(path.read_bytes()).hexdigest()
              for path in sorted((root / "reference").glob("*.png"))
          }
          manifest = json.loads(Path("tools/design-sync/manifest.json").read_text(encoding="utf-8"))
          (root / "delivery/manifest.json").write_text(json.dumps({
              "version": 1,
              "event": os.environ["GITHUB_EVENT_NAME"],
              "manual_base_sha": os.environ.get("MANUAL_BASE_SHA") or None,
              "manual_base_ref": os.environ.get("MANUAL_BASE_REF") or None,
              "manual_head_ref": os.environ.get("MANUAL_HEAD_REF") or None,
              "pr": int(os.environ["PR"]),
              "sha": os.environ["SHA"],
              "run_id": int(os.environ["RUN_ID"]),
              "run_attempt": int(os.environ["RUN_ATTEMPT"]),
              "workflow_sha256": hashlib.sha256(Path(".github/workflows/design-drift.yml").read_bytes()).hexdigest(),
              "contracts_sha256": hashlib.sha256(contracts_path.read_bytes()).hexdigest(),
              "candidate_manifest_sha256": hashlib.sha256(head_manifest.read_bytes()).hexdigest(),
              "structure_contract_sha256": hashlib.sha256(head_contract.read_bytes()).hexdigest(),
              "structure_report_sha256": hashlib.sha256(structure_report.read_bytes()).hexdigest(),
              "reference_export_status": os.environ["REFERENCE_EXPORT_STATUS"],
              "structure_verification_status": os.environ["STRUCTURE_VERIFICATION_STATUS"],
              "primary_contract": os.environ.get("PRIMARY_CONTRACT") or None,
              "figma_file_key": manifest["figmaFileKey"],
              "media_sha256": media,
          }, sort_keys=True), encoding="utf-8")
          PY

      - name: Upload exact-head Figma reference evidence
        if: ${{ always() && github.event_name != 'schedule' && steps.scope.outputs.primary_contract != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: figma-reference-evidence-${{ steps.manual.outputs.pr || github.event.pull_request.number }}-${{ steps.manual.outputs.head_sha || github.event.pull_request.head.sha }}
          path: figma-reference/
          if-no-files-found: error
          retention-days: 7

      - name: Require authenticated Figma evidence
        if: ${{ github.event_name != 'schedule' && steps.scope.outputs.primary_contract != '' && (steps.figma-export.outcome != 'success' || steps.structure.outcome != 'success') }}
        run: |
          echo '::error::Figma reference export and structure verification must both succeed'
          exit 1

      # Scheduled drift remains a legacy staging-app health check. It is intentionally not
      # presented as exact-head PR evidence.
      - name: Checkout app source for legacy drift check
        if: ${{ github.event_name == 'schedule' }}
        uses: actions/checkout@v4
        with:
          repository: Rem-Assistant/RemClaw
          ref: staging
          path: app
          token: ${{ secrets.APP_REPO_TOKEN }}

      - name: SwiftUI snapshots for legacy drift check
        if: ${{ github.event_name == 'schedule' }}
        working-directory: app
        env:
          SNAPSHOT_OUT_DIR: ${{ github.workspace }}/artifacts/swiftui
        run: |
          cp ../tools/design-sync/snapshots/RemDesignSnapshots.swift.example RemTests/RemDesignSnapshots.swift
          xcodebuild test \
            -scheme Rem \
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro' \
            -only-testing:RemTests/RemDesignSnapshots | xcpretty || true

      - name: Compare legacy staging-app snapshots
        if: ${{ github.event_name == 'schedule' }}
        run: |
          cd tools/design-sync && npm ci
          cd "$GITHUB_WORKSPACE"
          node tools/design-sync/compare.mjs artifacts/swiftui artifacts/figma --maxDiffRatio=0.02

      - name: Upload scheduled/manual diagnostics
        if: ${{ always() && github.event_name == 'schedule' }}
        uses: actions/upload-artifact@v4
        with:
          name: design-drift-report
          path: |
            artifacts/design-drift-report.json
            artifacts/figma-structure-report.json
            artifacts/diff/
          if-no-files-found: warn
