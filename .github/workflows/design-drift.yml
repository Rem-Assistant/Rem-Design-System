# Design ↔ code drift-check (#2). Renders the SwiftUI components, exports the matching Figma
# components, and fails if they diverge. Template — fill in the marked values.
name: design-drift

on:
  workflow_dispatch:
  # Secret-bearing reference exports run from the default-branch workflow. This job never checks
  # out or executes pull-request code; exact-head SwiftUI/Compose renders stay in screenshots.yml.
  pull_request_target:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths:
      - 'Sources/**'
      - 'compose/**'
      - 'tokens/generated/**'
      - 'docs/contracts/**'
      - 'tools/design-sync/**'
      - 'tools/render-evidence/**'
      - 'code-connect/**'
      - 'figma.*.config.json'
  schedule:
    - cron: '0 7 * * 1' # weekly guardrail

permissions:
  contents: read

jobs:
  drift:
    runs-on: macos-14 # needs Xcode for the SwiftUI ImageRenderer snapshots
    steps:
      - name: Checkout design system (this repo)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      - name: Select explicit delivery scope
        id: scope
        if: ${{ github.event_name == 'pull_request_target' }}
        run: |
          python3 - <<'PY'
          import json, os
          event = json.loads(open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8").read())
          scopes = [
              label["name"].removeprefix("delivery-scope:")
              for label in event["pull_request"].get("labels", [])
              if label.get("name", "").startswith("delivery-scope:")
          ]
          if len(scopes) > 1:
              raise SystemExit("at most one delivery-scope label is allowed")
          primary = scopes[0] if scopes else ""
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"primary_contract={primary}\n")
          PY

      - name: Figma export → artifacts/figma
        id: figma-export
        continue-on-error: true
        env:
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
        run: |
          set -euo pipefail
          node tools/design-sync/export-figma.mjs artifacts/figma

      - name: Assemble exact-head Figma reference evidence
        if: ${{ always() && github.event_name == 'pull_request_target' }}
        env:
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          REFERENCE_EXPORT_STATUS: ${{ steps.figma-export.outcome }}
          PRIMARY_CONTRACT: ${{ steps.scope.outputs.primary_contract }}
        run: |
          set -euo pipefail
          SCOPE_ARGS=()
          if [ -n "$PRIMARY_CONTRACT" ]; then
            SCOPE_ARGS=(--primary-contract "$PRIMARY_CONTRACT")
          fi
          mkdir -p figma-reference/delivery
          python3 tools/render-evidence/stage_references.py \
            --source artifacts/figma --destination figma-reference/reference \
            --contracts tools/render-evidence/contracts.json "${SCOPE_ARGS[@]}"
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path

          root = Path("figma-reference")
          contracts_path = Path("tools/render-evidence/contracts.json")
          media = {
              path.relative_to(root).as_posix(): hashlib.sha256(path.read_bytes()).hexdigest()
              for path in sorted((root / "reference").glob("*.png"))
          }
          manifest = json.loads(Path("tools/design-sync/manifest.json").read_text(encoding="utf-8"))
          (root / "delivery/manifest.json").write_text(json.dumps({
              "version": 1,
              "pr": int(os.environ["PR"]),
              "sha": os.environ["SHA"],
              "run_id": int(os.environ["RUN_ID"]),
              "run_attempt": int(os.environ["RUN_ATTEMPT"]),
              "workflow_sha256": hashlib.sha256(Path(".github/workflows/design-drift.yml").read_bytes()).hexdigest(),
              "contracts_sha256": hashlib.sha256(contracts_path.read_bytes()).hexdigest(),
              "reference_export_status": os.environ["REFERENCE_EXPORT_STATUS"],
              "primary_contract": os.environ.get("PRIMARY_CONTRACT") or None,
              "figma_file_key": manifest["figmaFileKey"],
              "media_sha256": media,
          }, sort_keys=True), encoding="utf-8")
          PY

      - name: Upload exact-head Figma reference evidence
        if: ${{ always() && github.event_name == 'pull_request_target' }}
        uses: actions/upload-artifact@v4
        with:
          name: figma-reference-evidence-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: figma-reference/
          if-no-files-found: error
          retention-days: 7

      - name: Require Figma reference export
        if: ${{ github.event_name == 'pull_request_target' && steps.figma-export.outcome != 'success' }}
        run: |
          echo '::error::Figma reference export failed; authenticated reference evidence is unavailable'
          exit 1

      - name: Checkout app source
        uses: actions/checkout@v4
        with:
          repository: Rem-Assistant/RemClaw
          ref: staging
          path: app
          token: ${{ secrets.APP_REPO_TOKEN }} # PAT with read access to RemClaw

      - name: SwiftUI snapshots → artifacts/swiftui
        working-directory: app
        env:
          SNAPSHOT_OUT_DIR: ${{ github.workspace }}/artifacts/swiftui
        run: |
          # copy the snapshot test in, then run just it (adjust scheme/destination to the project)
          cp ../tools/design-sync/snapshots/RemDesignSnapshots.swift.example RemTests/RemDesignSnapshots.swift
          xcodebuild test \
            -scheme Rem \
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro' \
            -only-testing:RemTests/RemDesignSnapshots | xcpretty || true

      - name: Compare
        run: |
          cd tools/design-sync && npm ci
          cd "$GITHUB_WORKSPACE"
          node tools/design-sync/compare.mjs artifacts/swiftui artifacts/figma --maxDiffRatio=0.02

      - name: Upload diffs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with: { name: design-diffs, path: artifacts/diff }
