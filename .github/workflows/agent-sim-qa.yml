name: agent-sim-qa

# Hosted visual diagnostic (dispatch only). A model looks at simulator screenshots of the iOS
# Playground, chooses one typed input at a time (Read tool only), and a runner-local executor runs it:
# the XCTest bridge (arm xctest) or idb's HID-level input (arm idb). Evidence beside the deterministic XCUITest journeys, never a native receipt, release
# gate, approval or waiver. See tools/agent-sim-qa/README.md.
#
# No pull_request/push trigger: fork code never runs beside the model token. The app under test is
# limited to the exact SHAs listed below; adding one is a reviewed change to this file. Each scenario
# also names the SHAs it may run on (tools/agent-sim-qa/simqa.py SCENARIOS); a mismatch stops the job
# before anything is built.

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Exact Playground commit to build (c23521b = Build 7 baseline, 6fa6366 = Build 8 candidate, 73ac818 = Build 9)
        type: choice
        default: c23521b43fd6b0dd62e5c8207a45611ac86e4d4f
        options:
          - c23521b43fd6b0dd62e5c8207a45611ac86e4d4f
          - 6fa6366928c41331615bf1eb1810b871df8f9378
          - 73ac81894508035730e901476f03d5b909ef758e
      scenario:
        description: Builds 7/8 catalog-chat-*; Build 9 b9-* (gesture questions, or twins of passing journeys)
        type: choice
        default: catalog-chat-add
        options:
          - catalog-chat-add
          - catalog-chat-model-menu-add
          - b9-shell-chat-gestures
          - b9-hub-chat-gestures
          - b9-hub-chat-jump-to-latest
          - b9-shell-sidebar-agent
          - b9-shell-settings-from-account
      arm:
        description: Touch injection (xctest = XCTest-synthesized via the UI-test bridge; idb = HID-level idb ui tap/swipe)
        type: choice
        default: xctest
        options:
          - xctest
          - idb

permissions:
  contents: read

# One running and one pending run per arm and scenario, so the two arms run side by side. A third
# dispatch of the same pair would replace the pending one; wait for a run to start before queueing more.
concurrency:
  group: agent-sim-qa-${{ inputs.arm }}-${{ inputs.scenario }}
  cancel-in-progress: false

env:
  # Same CLI pin and model as the Agent Factory roles (samuelalake/agent-factory@bdc3fda).
  CLAUDE_CODE_VERSION: 2.1.236
  CLAUDE_MODEL: claude-opus-4-8
  SIM_NAME: iPhone 15
  SIM_RUNTIME_SUFFIX: iOS-17-5
  JOB_MINUTES: 55
  # idb arm only. Exact versions; the install step fails if Homebrew or pip resolves anything else.
  IDB_COMPANION_VERSION: 1.1.8
  FB_IDB_VERSION: 1.1.7

jobs:
  visual-diagnostic:
    name: Model-driven check (diagnostic only)
    if: github.repository == 'Rem-Assistant/Rem-Design-System'
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      # One deadline for the whole job; every later budget (build, bridge, each model call) derives
      # from it so the run ends cleanly, with its partial record, before the job timeout.
      - name: Fix the job deadline and validate inputs
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_REF" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::source_ref must be a full SHA"; exit 1; }
          deadline=$(( $(date +%s) + JOB_MINUTES * 60 ))
          {
            echo "JOB_DEADLINE=$deadline"
            echo "SOURCE_SHA=$SOURCE_REF"
            echo "QA_ROOT=$RUNNER_TEMP/agent-sim-qa"
          } >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/agent-sim-qa/out" "$RUNNER_TEMP/agent-sim-qa/raw" "$RUNNER_TEMP/agent-sim-qa/box"

      # The harness always comes from the dispatch ref; the app under test from the exact SHA.
      - name: Check out the diagnostic harness
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: harness
          persist-credentials: false
      - name: Check out the source under test
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_ref }}
          path: src
          persist-credentials: false

      - name: Self-test the harness checks
        env:
          SCENARIO: ${{ inputs.scenario }}
        run: |
          set -euo pipefail
          python3 -m unittest discover -s harness/tools/agent-sim-qa -p 'test_*.py'
          python3 harness/tools/agent-sim-qa/controller.py check-inputs --sha "$SOURCE_SHA" --scenario "$SCENARIO"

      # Review fix 3 (part 1): pristine checkout at exactly the requested SHA, before anything else.
      - name: Verify pristine source at the exact SHA
        run: |
          set -euo pipefail
          python3 harness/tools/agent-sim-qa/controller.py verify-source \
            --src src --sha "$SOURCE_SHA" --out "$QA_ROOT/out"
          test -d src/tools/playground-ios/RemSettingsPlayground.xcodeproj

      - name: Select and boot the simulator
        run: |
          set -euo pipefail
          xcodebuild -version
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, os, sys
          for runtime, devices in json.load(sys.stdin)["devices"].items():
              if runtime.endswith(os.environ["SIM_RUNTIME_SUFFIX"]):
                  for device in devices:
                      if device["name"] == os.environ["SIM_NAME"]:
                          print(device["udid"]); sys.exit()
          ')
          [[ -n "$udid" ]] || { echo "::error::No $SIM_NAME ($SIM_RUNTIME_SUFFIX) simulator on this runner"; exit 1; }
          echo "SIM_UDID=$udid" >> "$GITHUB_ENV"
          xcrun simctl boot "$udid" 2>/dev/null || true
          xcrun simctl bootstatus "$udid" -b >/dev/null
          # Same keyboard tip suppression as tools/playground-ios/run-hosted-journeys.sh.
          xcrun simctl spawn "$udid" defaults write com.apple.keyboard.preferences DidShowContinuousPathIntroduction -bool true || true
          xcrun simctl spawn "$udid" defaults write com.apple.keyboard.preferences KeyboardContinuousPathEnabled -bool false || true

      # Only the disposable UI-test target receives the bridge; app sources stay byte-identical.
      - name: Add the local input bridge to the UI-test target
        run: |
          set -euo pipefail
          cat harness/tools/agent-sim-qa/AgentVisualBridge.swift \
            >> src/tools/playground-ios/UITests/PlaygroundNavigationUITests.swift
          python3 harness/tools/agent-sim-qa/controller.py verify-source \
            --src src --sha "$SOURCE_SHA" --out "$QA_ROOT/out" --injected

      # Same project, scheme, SDK, simulator and SHA stamp as run-hosted-journeys.sh. Unsigned.
      # No secret is in this step's environment; GITHUB_ENV/GITHUB_PATH/GITHUB_OUTPUT are withheld.
      - name: Build the Playground and bridge for testing
        timeout-minutes: 25
        run: |
          set -euo pipefail
          cd src
          env -u GITHUB_ENV -u GITHUB_PATH -u GITHUB_OUTPUT -u GITHUB_STEP_SUMMARY xcodebuild build-for-testing \
            -project tools/playground-ios/RemSettingsPlayground.xcodeproj \
            -scheme RemSettingsPlayground \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$SIM_UDID" \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            REM_PLAYGROUND_SOURCE_SHA="$SOURCE_SHA" \
            CODE_SIGNING_ALLOWED=NO > "$QA_ROOT/out/build.log" 2>&1 || {
              tail -60 "$QA_ROOT/out/build.log"; exit 1; }
          tail -5 "$QA_ROOT/out/build.log"

      # Review fix 3 (part 2): the built app embeds exactly the checked-out SHA.
      - name: Verify the built app's source SHA
        run: |
          set -euo pipefail
          python3 harness/tools/agent-sim-qa/controller.py verify-built \
            --app "$RUNNER_TEMP/dd/Build/Products/Debug-iphonesimulator/RemSettingsPlayground.app" \
            --sha "$SOURCE_SHA" --out "$QA_ROOT/out"

      # Third-party code, installed only for the idb arm and before the token exists in any step. It runs
      # (like the candidate app) as the runner user; the controller gives it the credential-free env.
      - name: Install pinned idb (idb arm only)
        if: inputs.arm == 'idb'
        run: |
          set -euo pipefail
          # Homebrew now refuses the facebook/fb tap as untrusted; use the pinned release archive instead.
          archive="$RUNNER_TEMP/idb-companion.universal.tar.gz"
          curl -sSfL -o "$archive" \
            "https://github.com/facebook/idb/releases/download/v$IDB_COMPANION_VERSION/idb-companion.universal.tar.gz"
          echo "3b72cc6a9a5b1a22a188205a84090d3a294347a846180efd755cf1a3c848e3e7  $archive" | shasum -a 256 -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/idb-companion.universal/bin/idb_companion" --version
          echo "$RUNNER_TEMP/idb-companion.universal/bin" >> "$GITHUB_PATH"
          python3 -m venv "$RUNNER_TEMP/idb-venv"
          "$RUNNER_TEMP/idb-venv/bin/pip" install --disable-pip-version-check "fb-idb==$FB_IDB_VERSION"
          "$RUNNER_TEMP/idb-venv/bin/idb" --help >/dev/null
          echo "$RUNNER_TEMP/idb-venv/bin" >> "$GITHUB_PATH"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install the pinned Claude Code CLI
        run: npm install -g "@anthropic-ai/claude-code@$CLAUDE_CODE_VERSION"

      # Review fixes 1, 2 and 4 are enforced inside controller.py (see README). The token is
      # referenced only here; the controller passes it only to the Read-only model process and
      # strips credential-named variables from the XCTest/xcodebuild process.
      - name: Run the visual diagnostic
        timeout-minutes: 30
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          SCENARIO: ${{ inputs.scenario }}
          ARM: ${{ inputs.arm }}
        run: |
          set -euo pipefail
          now=$(date +%s)
          step_end=$(( now + 28 * 60 ))
          deadline=$(( JOB_DEADLINE < step_end ? JOB_DEADLINE : step_end ))
          env -u GITHUB_TOKEN python3 harness/tools/agent-sim-qa/controller.py run \
            --src "$GITHUB_WORKSPACE/src" --sha "$SOURCE_SHA" --udid "$SIM_UDID" \
            --derived-data "$RUNNER_TEMP/dd" --out "$QA_ROOT/out" --raw "$QA_ROOT/raw" \
            --mailbox "$QA_ROOT/box" --prompt harness/tools/agent-sim-qa/prompt.md \
            --deadline "$deadline" --scenario "$SCENARIO" --model "$CLAUDE_MODEL" --arm "$ARM" \
            --app "$RUNNER_TEMP/dd/Build/Products/Debug-iphonesimulator/RemSettingsPlayground.app"

      - name: Summarize
        if: always()
        env:
          ARM: ${{ inputs.arm }}
        run: |
          {
            echo "Exact source: \`${SOURCE_SHA:-unknown}\` (dispatch harness \`$GITHUB_SHA\`); arm \`$ARM\`."
            echo
            if [[ -s "$QA_ROOT/out/summary.md" ]]; then cat "$QA_ROOT/out/summary.md"
            else echo "The diagnostic stopped before the model loop; see the step logs and source-verification.json."; fi
          } >> "$GITHUB_STEP_SUMMARY"

      # Frames (before/after every input), UI listings, receipt, sanitized transcript summary, source
      # verification and logs. The raw model transcripts in $QA_ROOT/raw are never uploaded.
      - name: Retain diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: agent-sim-qa-${{ inputs.arm }}-${{ inputs.scenario }}-${{ inputs.source_ref }}-${{ github.run_id }}
          path: ${{ runner.temp }}/agent-sim-qa/out/
          retention-days: 7
          if-no-files-found: warn

      - name: Delete raw model transcripts
        if: always()
        run: rm -rf "$RUNNER_TEMP/agent-sim-qa/raw"
