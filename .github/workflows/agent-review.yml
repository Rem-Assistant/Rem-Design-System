name: agent-review
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to review again
        required: true
        type: string
concurrency:
  group: rem-review-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: true
permissions:
  actions: read
  checks: read
  contents: write
  issues: write
  pull-requests: write
  statuses: write
jobs:
  review:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) ||
      ((github.event.pull_request.base.ref == 'main' || github.event.pull_request.base.ref == 'codex/playground-expansion') &&
      github.event.pull_request.head.repo.fork == false &&
      (github.event.action != 'edited' ||
      (github.actor == 'agent-factory-builder[bot]' && github.event.changes.body &&
      (contains(github.event.pull_request.body, 'builder-delivery-status:ready') ||
      contains(github.event.pull_request.body, 'builder-delivery-status:failed')))))
    uses: samuelalake/agent-factory/.github/workflows/review.yml@9a77601d21c33708a9bfb2eeea2070ac7b819ea8
    with:
      pr: ${{ format('{0}', github.event.pull_request.number || inputs.pr) }}
      validated_routing: true
      factory_ref: 9a77601d21c33708a9bfb2eeea2070ac7b819ea8
      reviewer_app_id: ${{ vars.AGENT_FACTORY_REVIEWER_APP_ID }}
      steward_app_id: ${{ vars.AGENT_FACTORY_STEWARD_APP_ID }}
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      AGENT_FACTORY_REVIEWER_APP_ID: ${{ secrets.AGENT_FACTORY_REVIEWER_APP_ID }}
      AGENT_FACTORY_REVIEWER_APP_PRIVATE_KEY: ${{ secrets.AGENT_FACTORY_REVIEWER_APP_PRIVATE_KEY }}
      AGENT_FACTORY_STEWARD_APP_ID: ${{ secrets.AGENT_FACTORY_STEWARD_APP_ID }}
      AGENT_FACTORY_STEWARD_APP_PRIVATE_KEY: ${{ secrets.AGENT_FACTORY_STEWARD_APP_PRIVATE_KEY }}
