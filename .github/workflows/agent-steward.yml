name: agent-steward
on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number
        required: true
        type: string
      base_ref:
        description: Allowed target branch; blank reuses the task route or repository default
        required: false
        type: string
permissions:
  issues: read
  contents: read
jobs:
  steward:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && (github.event_name == 'workflow_dispatch' || github.event.label.name == 'ready' || github.event.label.name == 'agent:steward' || github.event.label.name == 'agent:retry')
    uses: samuelalake/agent-factory/.github/workflows/steward.yml@bdc3fda75d2d4d4cc619b1d70012127d9e18fbb8
    with:
      issue: ${{ format('{0}', github.event.issue.number || inputs.issue) }}
      validated_routing: true
      base_ref: ${{ inputs.base_ref }}
      factory_ref: bdc3fda75d2d4d4cc619b1d70012127d9e18fbb8
      app_id: ${{ vars.AGENT_FACTORY_STEWARD_APP_ID }}
    secrets:
      AGENT_FACTORY_STEWARD_APP_ID: ${{ secrets.AGENT_FACTORY_STEWARD_APP_ID }}
      AGENT_FACTORY_STEWARD_APP_PRIVATE_KEY: ${{ secrets.AGENT_FACTORY_STEWARD_APP_PRIVATE_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
