name: publish-builder-delivery

# Publishes the runner-produced render evidence (from `screenshots.yml`) into the Agent Factory
# Builder delivery, head-bound, so the Reviewer sees the renders (config: review.require_builder_delivery
# + review.fallback_visual_evidence). Runs in the privileged `workflow_run` context — it never executes
# PR code — and mirrors the swami reference publisher's trust binding: same-repo only, head-SHA pinned,
# the producing workflow's sha256 verified against the base branch, the PR forbidden from modifying that
# workflow, and every media file digest-checked before it is attached. Live Figma references come
# from the matching exact-head design-drift run; this privileged workflow receives no Figma secret.

on:
  workflow_run:
    workflows: [screenshots]
    types: [completed]

concurrency:
  group: publish-builder-delivery-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read
  pull-requests: read

env:
  # The exact Agent Factory the consumer pins (must match the reviewer's factory_ref) so the delivery
  # CLI is the version the Reviewer reads back.
  FACTORY_REF: 4cf1e5e84ad0a801f93720aa42ca813f4819fe97
  GH_ATTACHMENT_CLI_VERSION: 2.100.0
  GH_ATTACHMENT_CLI_SHA256: e4d4bb4498e8d007abe545b6568926793ace1b6447da598294a610018cb164be

jobs:
  locate:
    # Same-repo pull_request runs only — fork runs have no App/media secrets, so evidence is withheld.
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      present: ${{ steps.artifact.outputs.present }}
    steps:
      - name: Locate this run's Builder-evidence artifact
        id: artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          count=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts?name=builder-evidence" --jq .total_count)
          test "$count" -le 1
          if [ "$count" = "1" ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi

  publish:
    needs: locate
    if: needs.locate.outputs.present == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
      pull-requests: write
    steps:
      - name: Download this verification run's evidence
        uses: actions/download-artifact@v4
        with:
          name: builder-evidence
          path: ${{ runner.temp }}/evidence
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Validate run, head, manifest, and media
        id: validate
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          EVIDENCE_ROOT: ${{ runner.temp }}/evidence
        run: |
          set -euo pipefail
          PR=$(jq -r .pr "$EVIDENCE_ROOT/delivery/manifest.json")
          pr_meta=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}")
          test "$(jq -r .head.sha <<<"$pr_meta")" = "$SHA"
          test "$(jq -r .base.repo.full_name <<<"$pr_meta")" = "$GITHUB_REPOSITORY"
          base_ref=$(jq -r .base.ref <<<"$pr_meta")
          base_sha=$(jq -r .base.sha <<<"$pr_meta")
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
          mapfile -t scopes < <(jq -r '.labels[].name | select(startswith("delivery-scope:")) | sub("^delivery-scope:"; "")' <<<"$pr_meta")
          test "${#scopes[@]}" -le 1
          if [ "${#scopes[@]}" = "1" ]; then
            [[ "${scopes[0]}" =~ ^[a-z0-9-]+$ ]]
            echo "primary_contract=${scopes[0]}" >> "$GITHUB_OUTPUT"
          else
            echo "primary_contract=" >> "$GITHUB_OUTPUT"
          fi
          case "$base_ref" in main) ;; *) echo "::error::unsupported evidence base branch: $base_ref"; exit 1 ;; esac
          run_meta=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}")
          test "$(jq -r .path <<<"$run_meta")" = ".github/workflows/screenshots.yml"
          gh api "repos/${GITHUB_REPOSITORY}/commits/${SHA}/pulls" --jq '.[].number' | grep -Fxq "$PR"
          artifact=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts?name=builder-evidence")
          test "$(jq -r .total_count <<<"$artifact")" = "1"
          test "$(jq -r '.artifacts[0].workflow_run.id' <<<"$artifact")" = "$RUN_ID"
          test "$(jq -r '.artifacts[0].workflow_run.head_sha' <<<"$artifact")" = "$SHA"
          # The evidence must be produced by the trusted base-branch workflow, and the PR must not
          # modify that workflow (a control-plane change merges separately before it can produce evidence).
          trusted_workflow_sha=$(gh api --method GET "repos/${GITHUB_REPOSITORY}/contents/.github/workflows/screenshots.yml" -f ref="$base_sha" --jq .content \
            | tr -d '\n' | base64 --decode | shasum -a 256 | awk '{print $1}')
          trusted_design_workflow_sha=$(gh api --method GET "repos/${GITHUB_REPOSITORY}/contents/.github/workflows/design-drift.yml" -f ref="$base_sha" --jq .content \
            | tr -d '\n' | base64 --decode | shasum -a 256 | awk '{print $1}')
          echo "trusted_design_workflow_sha=$trusted_design_workflow_sha" >> "$GITHUB_OUTPUT"
          files=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}/files" --paginate --jq '.[].filename')
          printf '%s\n' "$files" > "$RUNNER_TEMP/evidence-changed-paths.txt"
          if printf '%s\n' "$files" | grep -Fxq ".github/workflows/screenshots.yml"; then
            echo "::error::the evidence-producing workflow changed in this PR; merge that control-plane change separately before publishing Builder evidence"
            exit 1
          fi
          if printf '%s\n' "$files" | grep -Fxq ".github/workflows/design-drift.yml"; then
            echo "::error::the Figma evidence-producing workflow changed in this PR; merge that control-plane change separately before publishing Builder evidence"
            exit 1
          fi
          python3 - "$PR" "$SHA" "$EVIDENCE_ROOT" "$RUN_ID" "$RUN_ATTEMPT" "$trusted_workflow_sha" <<'PY'
          import hashlib
          import json
          import re
          import sys
          from pathlib import Path

          root = Path(sys.argv[3]).resolve()
          manifest = json.loads((root / "delivery/manifest.json").read_text(encoding="utf-8"))
          if manifest.get("pr") != int(sys.argv[1]) or manifest.get("sha") != sys.argv[2]:
              raise SystemExit("evidence manifest does not match the triggering PR head")
          if manifest.get("run_id") != int(sys.argv[4]) or manifest.get("run_attempt") != int(sys.argv[5]):
              raise SystemExit("evidence manifest does not match the triggering run attempt")
          if manifest.get("workflow_sha256") != sys.argv[6]:
              raise SystemExit("evidence was not produced by the trusted base-branch workflow")
          media = manifest.get("media_sha256")
          if not isinstance(media, dict) or not media:
              raise SystemExit("evidence declares no media")
          actual = {p.relative_to(root).as_posix()
                    for platform in ("swiftui", "compose") for p in (root / platform).glob("*.png")}
          if actual != set(media):
              raise SystemExit("artifact images do not exactly match the authenticated manifest")
          for relative, expected_digest in media.items():
              if not re.fullmatch(r"(swiftui|compose)/[A-Za-z0-9._-]+\.png", str(relative)):
                  raise SystemExit(f"unexpected media path: {relative}")
              if not re.fullmatch(r"[0-9a-f]{64}", str(expected_digest)):
                  raise SystemExit(f"invalid evidence digest for {relative}")
              path = (root / relative).resolve()
              if root not in path.parents or not path.is_file():
                  raise SystemExit(f"missing or unsafe evidence path: {relative}")
              if hashlib.sha256(path.read_bytes()).hexdigest() != expected_digest:
                  raise SystemExit(f"evidence digest mismatch for {relative}")
          PY

      - name: Checkout trusted consumer delivery formatter
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.validate.outputs.base_sha }}
          path: consumer-delivery
          persist-credentials: false

      - name: Locate exact-head Figma reference evidence
        id: figma-run
        if: ${{ steps.validate.outputs.primary_contract != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          BASE_SHA: ${{ steps.validate.outputs.base_sha }}
          EVIDENCE_ROOT: ${{ runner.temp }}/evidence
        run: |
          set -euo pipefail
          PR=$(jq -r .pr "$EVIDENCE_ROOT/delivery/manifest.json")
          artifact_name="figma-reference-evidence-${PR}-${SHA}"
          artifact=""
          for _ in $(seq 1 75); do
            if ! response=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${artifact_name}&per_page=100"); then
              sleep 20
              continue
            fi
            artifact=$(jq -c '[.artifacts[] | select(.expired == false)] | sort_by(.created_at, .id) | last // empty' <<<"$response")
            if [ -n "$artifact" ]; then break; fi
            sleep 20
          done
          test -n "$artifact"
          test "$(jq -r .name <<<"$artifact")" = "$artifact_name"
          run_id=$(jq -r .workflow_run.id <<<"$artifact")
          run_meta=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}")
          run_attempt=$(jq -r .run_attempt <<<"$run_meta")
          test "$(jq -r .path <<<"$run_meta")" = ".github/workflows/design-drift.yml"
          test "$(jq -r .event <<<"$run_meta")" = "pull_request_target"
          test "$(jq -r .status <<<"$run_meta")" = "completed"
          test "$(jq -r .conclusion <<<"$run_meta")" = "success"
          run_meta_path="$RUNNER_TEMP/figma-run-meta.json"
          artifact_meta_path="$RUNNER_TEMP/figma-artifact-meta.json"
          printf '%s' "$run_meta" > "$run_meta_path"
          printf '%s' "$artifact" > "$artifact_meta_path"
          # GitHub reports the feature SHA for pull_request_target runs and their artifacts. Bind
          # both to it, then authenticate the associated PR's exact head and expected base.
          python3 "$GITHUB_WORKSPACE/consumer-delivery/tools/render-evidence/validate_figma_run.py" \
            --run-meta "$run_meta_path" --artifact "$artifact_meta_path" \
            --repository "$GITHUB_REPOSITORY" --pr "$PR" \
            --head-sha "$SHA" --base-sha "$BASE_SHA" --base-ref main
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "run_attempt=$run_attempt" >> "$GITHUB_OUTPUT"
          echo "artifact_id=$(jq -r .id <<<"$artifact")" >> "$GITHUB_OUTPUT"

      - name: Download exact-head Figma reference evidence
        if: ${{ steps.validate.outputs.primary_contract != '' }}
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.figma-run.outputs.artifact_id }}
          path: ${{ runner.temp }}/figma-evidence
          merge-multiple: true
          repository: ${{ github.repository }}
          run-id: ${{ steps.figma-run.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Validate and stage authenticated Figma references
        if: ${{ steps.validate.outputs.primary_contract != '' }}
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
          FIGMA_ROOT: ${{ runner.temp }}/figma-evidence
          EVIDENCE_ROOT: ${{ runner.temp }}/evidence
          FIGMA_RUN_ID: ${{ steps.figma-run.outputs.run_id }}
          FIGMA_RUN_ATTEMPT: ${{ steps.figma-run.outputs.run_attempt }}
          TRUSTED_WORKFLOW_SHA: ${{ steps.validate.outputs.trusted_design_workflow_sha }}
          PRIMARY_CONTRACT: ${{ steps.validate.outputs.primary_contract }}
        run: |
          set -euo pipefail
          PR=$(jq -r .pr "$EVIDENCE_ROOT/delivery/manifest.json")
          figma_file_key=$(jq -r .figmaFileKey "$GITHUB_WORKSPACE/consumer-delivery/tools/design-sync/manifest.json")
          contracts_sha=$(shasum -a 256 "$GITHUB_WORKSPACE/consumer-delivery/tools/render-evidence/contracts.json" | awk '{print $1}')
          python3 "$GITHUB_WORKSPACE/consumer-delivery/tools/render-evidence/artifact.py" \
            --root "$FIGMA_ROOT" --pr "$PR" --sha "$SHA" \
            --run-id "$FIGMA_RUN_ID" --run-attempt "$FIGMA_RUN_ATTEMPT" \
            --workflow-sha256 "$TRUSTED_WORKFLOW_SHA" --media-dir reference \
            --figma-file-key "$figma_file_key" --contracts-sha256 "$contracts_sha" \
            --primary-contract "$PRIMARY_CONTRACT" \
            --require-reference-export --require-structure-verification
          mkdir -p "$EVIDENCE_ROOT/reference"
          cp "$FIGMA_ROOT"/reference/*.png "$EVIDENCE_ROOT/reference/"
          mkdir -p "$EVIDENCE_ROOT/structure"
          cp "$FIGMA_ROOT/structure/report.json" "$EVIDENCE_ROOT/structure/report.json"

      - name: Checkout exact Agent Factory publisher
        uses: actions/checkout@v4
        with:
          repository: samuelalake/agent-factory
          ref: ${{ env.FACTORY_REF }}
          path: factory-delivery
          persist-credentials: false

      - name: Validate trusted publisher
        run: |
          set -euo pipefail
          test "$(git -C factory-delivery rev-parse HEAD)" = "$FACTORY_REF"
          test -z "$(git -C factory-delivery status --porcelain)"

      - name: Install pinned GitHub attachment client
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gh_${GH_ATTACHMENT_CLI_VERSION}_linux_amd64.tar.gz"
          curl -fsSL --retry 3 -o "$archive" \
            "https://github.com/cli/cli/releases/download/v${GH_ATTACHMENT_CLI_VERSION}/gh_${GH_ATTACHMENT_CLI_VERSION}_linux_amd64.tar.gz"
          printf '%s  %s\n' "$GH_ATTACHMENT_CLI_SHA256" "$archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          cli_dir="$RUNNER_TEMP/gh_${GH_ATTACHMENT_CLI_VERSION}_linux_amd64/bin"
          "$cli_dir/gh" pr comment --help | grep -q -- '--attach'
          echo "$cli_dir" >> "$GITHUB_PATH"

      - name: Mint Builder installation token
        id: builder-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.AGENT_FACTORY_BUILDER_APP_ID }}
          private-key: ${{ secrets.AGENT_FACTORY_BUILDER_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Publish canonical Builder delivery into the PR
        env:
          GH_TOKEN: ${{ steps.builder-token.outputs.token }}
          AGENT_FACTORY_MEDIA_UPLOAD_TOKEN: ${{ secrets.AGENT_FACTORY_MEDIA_UPLOAD_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          VERIFY_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          EVIDENCE_ROOT: ${{ runner.temp }}/evidence
          PRIMARY_CONTRACT: ${{ steps.validate.outputs.primary_contract }}
        run: |
          set -euo pipefail
          PR=$(jq -r .pr "$EVIDENCE_ROOT/delivery/manifest.json")
          SCOPE_ARGS=()
          if [ -n "$PRIMARY_CONTRACT" ]; then
            SCOPE_ARGS=(--primary-contract "$PRIMARY_CONTRACT")
          fi
          python3 "$GITHUB_WORKSPACE/consumer-delivery/tools/render-evidence/delivery.py" \
            --evidence-root "$EVIDENCE_ROOT" --head "$SHA" --conclusion "$VERIFY_CONCLUSION" \
            --changed-paths "$RUNNER_TEMP/evidence-changed-paths.txt" \
            "${SCOPE_ARGS[@]}" \
            --output "$RUNNER_TEMP/paired-delivery"
          overall=$(cat "$RUNNER_TEMP/paired-delivery/status")
          ATTACHMENTS=()
          while IFS= read -r f; do ATTACHMENTS+=(--attach "$f"); done < <(jq -r '.[]' "$RUNNER_TEMP/paired-delivery/attachments.json")
          cd "$GITHUB_WORKSPACE/factory-delivery"
          PYTHONPATH=src python3 -m agent_factory.github_delivery \
            --repo "$REPO" --pr "$PR" --head "$SHA" --status "$overall" \
            --body-file "$RUNNER_TEMP/paired-delivery/body.md" "${ATTACHMENTS[@]}"

      - name: Retire the legacy screenshot comment
        env:
          GH_TOKEN: ${{ github.token }}
          EVIDENCE_ROOT: ${{ runner.temp }}/evidence
        run: |
          set -euo pipefail
          PR=$(jq -r .pr "$EVIDENCE_ROOT/delivery/manifest.json")
          gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" --paginate --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | contains("<!-- design-evidence -->"))) | .id' > "$RUNNER_TEMP/legacy-evidence-comments"
          while IFS= read -r id; do
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${id}" \
              -f body='<!-- design-evidence-retired -->
          Current paired screenshots and verification status are maintained in the **Delivery** section of this PR. This older screenshot surface has been retired.

          Authored by Codex.' > /dev/null
          done < "$RUNNER_TEMP/legacy-evidence-comments"
