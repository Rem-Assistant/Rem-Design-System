name: agent-gate
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number
        required: true
        type: string
permissions:
  contents: read
  pull-requests: read
  issues: read
  statuses: write
jobs:
  gate:
    uses: samuelalake/agent-factory/.github/workflows/gate.yml@bdc3fda75d2d4d4cc619b1d70012127d9e18fbb8
    with:
      pr: ${{ format('{0}', github.event.pull_request.number || inputs.pr) }}
      validated_routing: true
      factory_ref: bdc3fda75d2d4d4cc619b1d70012127d9e18fbb8
