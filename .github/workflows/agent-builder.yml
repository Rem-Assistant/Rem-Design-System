name: agent-builder
on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number
        required: true
        type: string
      base_ref:
        description: Allowed target branch; blank reuses the task route or repository default
        required: false
        type: string
permissions:
  issues: read
  actions: read
  contents: read
jobs:
  builder:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && (github.event_name == 'workflow_dispatch' || github.event.label.name == 'agent:builder')
    uses: samuelalake/agent-factory/.github/workflows/builder.yml@9a77601d21c33708a9bfb2eeea2070ac7b819ea8
    with:
      issue: ${{ format('{0}', github.event.issue.number || inputs.issue) }}
      validated_routing: true
      base_ref: ${{ inputs.base_ref }}
      factory_ref: 9a77601d21c33708a9bfb2eeea2070ac7b819ea8
      suppress_failure_escalation: true
      runner: ubuntu-latest
      app_id: ${{ vars.AGENT_FACTORY_BUILDER_APP_ID }}
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      AGENT_FACTORY_BUILDER_APP_ID: ${{ secrets.AGENT_FACTORY_BUILDER_APP_ID }}
      AGENT_FACTORY_BUILDER_APP_PRIVATE_KEY: ${{ secrets.AGENT_FACTORY_BUILDER_APP_PRIVATE_KEY }}
