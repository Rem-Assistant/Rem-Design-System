# Design ↔ code drift-check (#2). Renders the SwiftUI components, exports the matching Figma
# components, and fails if they diverge. Template — fill in the marked values.
name: design-drift

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tools/design-sync/**'
  schedule:
    - cron: '0 7 * * 1' # weekly guardrail

jobs:
  drift:
    runs-on: macos-14 # needs Xcode for the SwiftUI ImageRenderer snapshots
    steps:
      - name: Checkout design system (this repo)
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      - name: SwiftUI snapshots → artifacts/swiftui
        run: |
          set -eo pipefail
          rm -rf "$RUNNER_TEMP/DesignDriftSnapshots.xcresult"
          xcodebuild test \
            -scheme RemDesignSystem \
            -destination 'platform=iOS Simulator,name=iPhone 15' \
            -only-testing:RenderSnapshotTests \
            -resultBundlePath "$RUNNER_TEMP/DesignDriftSnapshots.xcresult" \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tail -60

      - name: Extract SwiftUI PNGs
        run: |
          set -eo pipefail
          brew install xcparse || brew install chargepoint/xcparse/xcparse
          mkdir -p artifacts/swiftui "$RUNNER_TEMP/design-drift-attachments"
          xcparse attachments "$RUNNER_TEMP/DesignDriftSnapshots.xcresult" "$RUNNER_TEMP/design-drift-attachments"
          find "$RUNNER_TEMP/design-drift-attachments" -name '*.png' | while IFS= read -r f; do
            b=$(basename "$f"); cp "$f" "artifacts/swiftui/${b%%_*}.png"
          done
          test -n "$(find artifacts/swiftui -name '*.png' -print -quit)"

      - name: Figma export → artifacts/figma
        env:
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
        run: node tools/design-sync/export-figma.mjs artifacts/figma

      - name: Compare
        run: |
          cd tools/design-sync && npm ci
          cd "$GITHUB_WORKSPACE"
          node tools/design-sync/compare.mjs artifacts/swiftui artifacts/figma \
            --threshold=0.3 \
            --maxDiffRatio=0.10 \
            --require=Consent-default-light,Consent-default-dark,Consent-error-dark,Consent-loading-light,Consent-terms-light,Consent-privacy-light

      - name: Publish machine-readable comparison report
        if: always() && hashFiles('artifacts/design-drift-report.json') != ''
        run: |
          echo '## Design drift comparison' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat artifacts/design-drift-report.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload comparison report
        if: always() && hashFiles('artifacts/design-drift-report.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: design-drift-report
          path: artifacts/design-drift-report.json

      - name: Upload diffs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with: { name: design-diffs, path: artifacts/diff }
