name: agent-sim-qa

# Proof of concept: a Claude Code agent drives the iOS Playground in a simulator like a person
# (screenshots, taps, typing) and writes a visual QA report. Evidence alongside the deterministic
# XCUITest journeys, never a release gate. See tools/agent-sim-qa/README.md.
#
# Dispatch only: no pull_request trigger, so code from an untrusted fork never runs next to the
# Claude token. The agent receives no GitHub token and only simulator-control tools.

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Branch or SHA whose Playground to test (must contain tools/playground-ios; default is the dispatch ref)
        type: string
        default: ''
      scenario:
        description: What the agent should do and verify, in plain words
        type: string
        default: "Open the Catalog, go to the Chat page, open the model menu, choose Automatic, then tap the composer's Add button and confirm the Add to Chat sheet appears with Photos and Files. Then dismiss it."

permissions:
  contents: read

concurrency:
  group: agent-sim-qa-${{ github.ref }}
  cancel-in-progress: false

env:
  # Pinned tool versions (each released at least two weeks before this workflow was written).
  CLAUDE_CODE_VERSION: 2.1.283
  AXE_VERSION: 1.8.0
  AXE_SHA256: 87eb09cd49dfc74fa8f7f5a46a03dfe2f14518b01d819f6a4094eab0d344ea7f
  BUNDLE_ID: com.rem.playground.settings
  SIM_NAME: iPhone 15
  SIM_RUNTIME_SUFFIX: iOS-17-5

jobs:
  agent-qa:
    name: Agent drives the iOS Playground
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      # The harness (prompt) always comes from the dispatch ref; the app under test from source_ref.
      - name: Check out the QA harness
        uses: actions/checkout@v4
        with:
          path: harness
          persist-credentials: false
      - name: Check out the source under test
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          path: src
          persist-credentials: false
      - name: Record the exact source revision
        run: |
          set -euo pipefail
          sha=$(git -C src rev-parse HEAD)
          echo "SOURCE_SHA=$sha" >> "$GITHUB_ENV"
          test -d src/tools/playground-ios/RemSettingsPlayground.xcodeproj || {
            echo "::error::$sha has no tools/playground-ios; pass a source_ref that contains the iOS Playground."; exit 1; }

      # Same project, scheme, SDK and destination as tools/playground-ios/run-hosted-journeys.sh.
      # GITHUB_ENV/GITHUB_PATH are withheld so build scripts cannot alter later steps' environment.
      - name: Build the iOS Playground for the simulator
        timeout-minutes: 30
        run: |
          set -euo pipefail
          cd src
          env -u GITHUB_ENV -u GITHUB_PATH xcodebuild build \
            -project tools/playground-ios/RemSettingsPlayground.xcodeproj \
            -scheme RemSettingsPlayground \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,name=$SIM_NAME,OS=17.5" \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            REM_PLAYGROUND_SOURCE_SHA="$SOURCE_SHA" \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee "$RUNNER_TEMP/build.log" | tail -40
          app="$RUNNER_TEMP/dd/Build/Products/Debug-iphonesimulator/RemSettingsPlayground.app"
          test -d "$app"
          echo "APP_PATH=$app" >> "$GITHUB_ENV"
          xcodebuild -version

      - name: Boot the simulator, install and launch
        run: |
          set -euo pipefail
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, os, sys
          for runtime, devices in json.load(sys.stdin)["devices"].items():
              if runtime.endswith(os.environ["SIM_RUNTIME_SUFFIX"]):
                  for device in devices:
                      if device["name"] == os.environ["SIM_NAME"]:
                          print(device["udid"]); sys.exit()
          ')
          test -n "$udid"
          echo "SIM_UDID=$udid" >> "$GITHUB_ENV"
          xcrun simctl boot "$udid" 2>/dev/null || true
          xcrun simctl bootstatus "$udid" -b >/dev/null
          # Same keyboard tip suppression as run-hosted-journeys.sh.
          xcrun simctl spawn "$udid" defaults write com.apple.keyboard.preferences DidShowContinuousPathIntroduction -bool true || true
          xcrun simctl spawn "$udid" defaults write com.apple.keyboard.preferences KeyboardContinuousPathEnabled -bool false || true
          xcrun simctl install "$udid" "$APP_PATH"
          xcrun simctl launch "$udid" "$BUNDLE_ID" --settings-light
          sleep 5

      - name: Install AXe (pinned, checksum-verified)
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/axe"
          mkdir -p "$dir"
          curl -fsSL -o "$RUNNER_TEMP/axe.tgz" \
            "https://github.com/cameroncooke/AXe/releases/download/v$AXE_VERSION/AXe-macOS-homebrew-v$AXE_VERSION.tar.gz"
          echo "$AXE_SHA256  $RUNNER_TEMP/axe.tgz" | shasum -a 256 -c -
          tar -xzf "$RUNNER_TEMP/axe.tgz" -C "$dir"
          # Ad-hoc sign as the Homebrew formula's post_install does.
          for framework in "$dir"/Frameworks/*.framework; do
            codesign --force --sign - --timestamp=none "$framework"
          done
          codesign --force --sign - --timestamp=none "$dir/axe"
          echo "$dir" >> "$GITHUB_PATH"
          "$dir/axe" --version
          # Preflight: the agent is useless if AXe cannot read this simulator.
          "$dir/axe" describe-ui --udid "$SIM_UDID" | head -c 2000

      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0

      # The agent runs outside both checkouts (no CLAUDE.md, no project settings or MCP config),
      # with only simulator-control tools, no GitHub token and no general shell.
      - name: Run the QA agent
        timeout-minutes: 30
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          SCENARIO: ${{ inputs.scenario }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/agent-qa"
          mkdir -p "$work/qa-artifacts"
          echo "QA_WORK=$work" >> "$GITHUB_ENV"
          python3 - "$GITHUB_WORKSPACE/harness/tools/agent-sim-qa/prompt.md" "$work/prompt.md" <<'PY'
          import os, sys
          text = open(sys.argv[1]).read()
          for key, value in {"UDID": os.environ["SIM_UDID"], "BUNDLE_ID": os.environ["BUNDLE_ID"],
                             "SCENARIO": os.environ["SCENARIO"]}.items():
              text = text.replace("{{" + key + "}}", value)
          open(sys.argv[2], "w").write(text)
          PY
          cd "$work"
          xcrun simctl io booted screenshot qa-artifacts/00-harness-start.png
          status=0
          env -u GITHUB_TOKEN npx -y "@anthropic-ai/claude-code@$CLAUDE_CODE_VERSION" \
            -p "$(cat prompt.md)" \
            --tools "Bash,Read,Write" \
            --allowedTools "Bash(axe:*)" "Bash(xcrun simctl io:*)" "Read" "Write" \
            --permission-mode dontAsk \
            --strict-mcp-config \
            --max-turns 40 \
            --output-format stream-json --verbose \
            > transcript.jsonl 2> agent-stderr.log || status=$?
          echo "Agent exited with status $status"
          tail -n 20 agent-stderr.log || true

      - name: Judge the report
        if: always()
        run: |
          set -euo pipefail
          work="${QA_WORK:-$RUNNER_TEMP/agent-qa}"
          report="$work/qa-report.md"
          {
            echo "## Agent simulator QA"
            echo
            echo "Source: \`${SOURCE_SHA:-unknown}\`"
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          if [ ! -s "$report" ]; then
            echo "The agent did not produce qa-report.md." >> "$GITHUB_STEP_SUMMARY"
            echo "::error::The agent did not produce qa-report.md"
            exit 1
          fi
          cat "$report" >> "$GITHUB_STEP_SUMMARY"
          cat "$report"
          if grep -qw FAIL "$report"; then
            echo "::error::The agent report contains FAIL"
            exit 1
          fi
          grep -q '^OVERALL: PASS' "$report" || { echo "::error::The report has no OVERALL: PASS line"; exit 1; }

      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-sim-qa-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/agent-qa/qa-report.md
            ${{ runner.temp }}/agent-qa/qa-artifacts/
            ${{ runner.temp }}/agent-qa/transcript.jsonl
            ${{ runner.temp }}/agent-qa/agent-stderr.log
            ${{ runner.temp }}/build.log
          if-no-files-found: warn
