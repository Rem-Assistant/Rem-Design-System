name: agent-gate
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  pull_request_review:
    types: [submitted, edited, dismissed]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number
        required: true
        type: string
permissions:
  contents: read
  pull-requests: read
  issues: read
  statuses: write
jobs:
  gate:
    uses: samuelalake/agent-factory/.github/workflows/gate.yml@bd85c0214dde83a06c85646022332029e320c32e
    with:
      pr: ${{ format('{0}', github.event.pull_request.number || inputs.pr) }}
      factory_ref: bd85c0214dde83a06c85646022332029e320c32e
    secrets: inherit
