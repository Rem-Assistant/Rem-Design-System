name: agent-figma-attest
on:
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number
        required: true
        type: string
      pr:
        description: Pull request number
        required: true
        type: string
      record_path:
        description: Checked-in Figma delivery record
        required: true
        type: string
      screen_prefix:
        description: Design-sync manifest screen prefix
        required: true
        type: string
permissions:
  contents: read
jobs:
  attest:
    uses: samuelalake/agent-factory/.github/workflows/figma-attest.yml@aece3450ee38de6dc3ff64afe7151ff41cb37878
    with:
      issue: ${{ inputs.issue }}
      pr: ${{ inputs.pr }}
      record_path: ${{ inputs.record_path }}
      screen_prefix: ${{ inputs.screen_prefix }}
      factory_ref: aece3450ee38de6dc3ff64afe7151ff41cb37878
      runner: ubuntu-latest
      app_id: ${{ vars.AGENT_FACTORY_BUILDER_APP_ID }}
    secrets:
      AGENT_FACTORY_BUILDER_APP_ID: ${{ secrets.AGENT_FACTORY_BUILDER_APP_ID }}
      AGENT_FACTORY_BUILDER_APP_PRIVATE_KEY: ${{ secrets.AGENT_FACTORY_BUILDER_APP_PRIVATE_KEY }}
