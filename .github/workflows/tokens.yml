name: contract

# Drift guards for the machine contract: the generated token files must match tokens.json,
# and manifest.json must match agent/props.json + the component front-matter. Both generators
# are dependency-free Node. See tools/README.md.

on:
  push:
    branches: [main]
    paths:
      - "tokens/**"
      - "agent/**"
      - "components/**"
      - "manifest.json"
      - "tools/**"
      - ".agent-factory/**"
      - "docs/contracts/**"
      - ".github/workflows/tokens.yml"
  pull_request:
    paths:
      - "tokens/**"
      - "agent/**"
      - "components/**"
      - "manifest.json"
      - "tools/**"
      - ".agent-factory/**"
      - "docs/contracts/**"
      - ".github/workflows/tokens.yml"

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Tokens in sync with tokens.json
        run: node tools/generate-tokens.mjs --check
      - name: manifest.json in sync with props + docs
        run: node tools/build-manifest.mjs --check
      - name: Paired evidence delivery contract
        run: python3 -m unittest discover -s tools/render-evidence -p 'test_*.py'
