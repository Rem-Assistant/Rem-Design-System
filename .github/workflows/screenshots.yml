name: screenshots

# Renders the design system to PNGs so the built output is VISIBLE — SwiftUI on an iOS Simulator via
# `xcodebuild test` (UIHostingController + layer.render, for true iOS UIColor semantics and
# ScrollView/List capture), Compose via Paparazzi (JVM, no emulator), on one macOS runner OS. The two
# render jobs are independent so one platform failing still posts the other; the evidence job
# assembles whatever rendered for the trusted publisher to validate and publish.

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to verify (both by default)
        type: choice
        default: both
        options: [both, ios, android]
      ios_test:
        description: Optional iOS test method for a focused diagnostic run
        type: string
        default: ''
  pull_request:
    paths:
      - "tools/playground-ios/**"
      - "Sources/**"
      - "compose/**"
      - "tokens/generated/**"
      - "tools/render-evidence/**"
      - "tools/render-swift/**"

permissions:
  contents: read

concurrency:
  group: screenshots-${{ github.ref }}-${{ inputs.platform || 'both' }}
  cancel-in-progress: true

jobs:
  swiftui:
    name: Render SwiftUI (iOS)
    if: inputs.platform != 'android'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: List schemes (debug)
        run: xcodebuild -list || true
      - name: Render on iOS Simulator (light + dark)
        run: |
          set -eo pipefail
          rm -rf "$RUNNER_TEMP/RenderSnapshots.xcresult"
          xcodebuild test \
            -scheme RemDesignSystem \
            -destination 'platform=iOS Simulator,name=iPhone 15' \
            -only-testing:RenderSnapshotTests \
            -resultBundlePath "$RUNNER_TEMP/RenderSnapshots.xcresult" \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tail -60
      - name: Extract PNGs from the xcresult
        run: |
          set -eo pipefail
          brew install xcparse || brew install chargepoint/xcparse/xcparse
          mkdir -p artifacts/swiftui "$RUNNER_TEMP/xc-attach"
          xcparse attachments "$RUNNER_TEMP/RenderSnapshots.xcresult" "$RUNNER_TEMP/xc-attach"
          # xcparse names files "<attachmentName>_<n>_<UUID>.png"; our attachment names have no
          # underscores, so strip from the first underscore to recover "Consent-light.png" etc.
          # (so they pair with the Android keys in the side-by-side table).
          find "$RUNNER_TEMP/xc-attach" -name '*.png' | while IFS= read -r f; do
            b=$(basename "$f"); cp "$f" "artifacts/swiftui/${b%%_*}.png"
          done
          echo "=== extracted ===" && ls -la artifacts/swiftui
      - uses: actions/upload-artifact@v4
        with:
          name: swiftui-screenshots
          path: artifacts/swiftui/*.png
          if-no-files-found: error

  compose:
    name: Render Compose (Android)
    if: inputs.platform != 'ios'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # macos-14 runners ship the Android SDK pre-installed (ANDROID_HOME set); the
      # android-actions/setup-android action fails trying to install the obsolete "tools"
      # package, so we rely on the pre-installed SDK instead.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Render components (Paparazzi record)
        working-directory: compose
        run: gradle :RemDesignSystem:recordPaparazziDebug --stacktrace --no-daemon
      - name: Collect PNGs
        run: |
          mkdir -p artifacts/compose
          find compose -path '*/snapshots/images/*.png' -print -exec cp {} artifacts/compose/ \;
      - run: ls -la artifacts/compose
      - uses: actions/upload-artifact@v4
        with:
          name: compose-screenshots
          path: artifacts/compose/*.png
          if-no-files-found: error

  settings-ios:
    name: Exercise Settings playground (iOS)
    if: (github.event.pull_request.base.ref == 'codex/settings-integration' || github.ref_name == 'codex/settings-integration') && inputs.platform != 'android'
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Run the actual playground journeys
        timeout-minutes: 40
        env:
          IOS_TEST: ${{ inputs.ios_test }}
        run: bash tools/playground-ios/run-hosted-journeys.sh
      - name: Extract actual playground screenshots
        if: always()
        run: |
          set -euo pipefail
          brew install xcparse || brew install chargepoint/xcparse/xcparse
          mkdir -p artifacts/settings-swiftui "$RUNNER_TEMP/settings-attachments"
          xcparse attachments "$RUNNER_TEMP/SettingsPlayground.xcresult" "$RUNNER_TEMP/settings-attachments"
          find "$RUNNER_TEMP/settings-attachments" -name '*.png' | while IFS= read -r f; do
            b=$(basename "$f")
            cp "$f" "artifacts/settings-swiftui/${b%%_*}.png"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: settings-swiftui-screenshots
          path: artifacts/settings-swiftui/*.png
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: settings-ios-build-log
          path: |
            ${{ runner.temp }}/settings-ios-build.log
            ${{ runner.temp }}/settings-ios-main-thread*.txt
          if-no-files-found: error
      - name: Package iOS journey diagnostics
        if: always()
        run: |
          if [ -d "$RUNNER_TEMP/SettingsPlayground.xcresult" ]; then
            tar -czf "$RUNNER_TEMP/settings-ios-journeys.tar.gz" -C "$RUNNER_TEMP" SettingsPlayground.xcresult
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: settings-ios-journeys
          path: ${{ runner.temp }}/settings-ios-journeys.tar.gz
          if-no-files-found: error

  settings-android:
    name: Exercise Settings playground (Android)
    if: (github.event.pull_request.base.ref == 'codex/settings-integration' || github.ref_name == 'codex/settings-integration') && inputs.platform != 'ios'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          disable-animations: true
          working-directory: compose
          # The action starts a separate shell per line; folded syntax keeps
          # test status and capture collection in one shell process.
          script: >-
            result=0;
            gradle :demo:connectedDebugAndroidTest --stacktrace --no-daemon || result=$?;
            mkdir -p ../artifacts/settings-compose;
            adb pull /sdcard/Pictures/RemSettingsPlayground/. ../artifacts/settings-compose/ || true;
            exit "$result"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: settings-compose-screenshots
          path: artifacts/settings-compose/*.png
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: settings-android-journeys
          path: |
            compose/demo/build/reports/androidTests/
            compose/demo/build/outputs/androidTest-results/
          if-no-files-found: error

  evidence:
    name: Assemble render evidence
    needs: [swiftui, compose, settings-ios, settings-android]
    if: ${{ always() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          path: dl
      # The privileged publisher owns the sole canonical paired delivery.
      # This job only assembles runner artifacts; it cannot write PR comments.
      - name: Assemble Builder evidence (out/ + manifest)
        if: ${{ always() && github.event_name == 'pull_request' }}
        env:
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          mkdir -p out/swiftui out/compose out/delivery
          cp dl/swiftui-screenshots/*.png out/swiftui/ 2>/dev/null || true
          cp dl/compose-screenshots/*.png out/compose/ 2>/dev/null || true
          cp dl/settings-swiftui-screenshots/*.png out/swiftui/ 2>/dev/null || true
          cp dl/settings-compose-screenshots/*.png out/compose/ 2>/dev/null || true
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          out = Path("out")
          media = {}
          for d in ("swiftui", "compose"):
              for p in sorted((out / d).glob("*.png")):
                  media[p.relative_to(out).as_posix()] = hashlib.sha256(p.read_bytes()).hexdigest()
          # workflow_sha256 binds the evidence to the exact producing workflow; the publisher
          # re-derives it from the base branch and refuses if this PR modified the workflow.
          Path("out/delivery/manifest.json").write_text(json.dumps({
              "pr": int(os.environ["PR"]),
              "sha": os.environ["SHA"],
              "run_id": int(os.environ["RUN_ID"]),
              "run_attempt": int(os.environ["RUN_ATTEMPT"]),
              "workflow_sha256": hashlib.sha256(Path(".github/workflows/screenshots.yml").read_bytes()).hexdigest(),
              "media_sha256": media,
          }), encoding="utf-8")
          print("media:", list(media))
          PY
      - name: Upload Builder evidence
        if: ${{ always() && github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@v4
        with:
          name: builder-evidence
          path: out/
          if-no-files-found: warn
