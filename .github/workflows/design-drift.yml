# Design ↔ code drift-check (#2). Renders the SwiftUI components, exports the matching Figma
# components, and fails if they diverge. Template — fill in the marked values.
name: design-drift

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tools/design-sync/**'
      - 'code-connect/**'
      - 'figma.*.config.json'
      - 'tsconfig.code-connect.json'
      - 'package.json'
      - 'package-lock.json'
  schedule:
    - cron: '0 7 * * 1' # weekly guardrail

jobs:
  drift:
    runs-on: macos-14 # needs Xcode for the SwiftUI ImageRenderer snapshots
    steps:
      - name: Checkout design system (this repo)
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      - name: Validate Code Connect templates
        run: |
          npm ci
          npm run check-code-connect

      - name: SwiftUI snapshots → artifacts/swiftui
        run: |
          set -eo pipefail
          rm -rf "$RUNNER_TEMP/DesignDriftSnapshots.xcresult"
          rm -rf "$RUNNER_TEMP/DesignDriftDerivedData"
          SIMULATOR_UDID="$(xcrun simctl list devices available -j | python3 -c 'import json, sys; devices=json.load(sys.stdin)["devices"]; print(next(device["udid"] for runtime in devices.values() for device in runtime if device["name"] == "iPhone 15" and device.get("isAvailable", False)))')"
          xcrun simctl boot "$SIMULATOR_UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b
          xcodebuild test \
            -scheme RemDesignSystem \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -derivedDataPath "$RUNNER_TEMP/DesignDriftDerivedData" \
            -only-testing:RenderSnapshotTests \
            -resultBundlePath "$RUNNER_TEMP/DesignDriftSnapshots.xcresult" \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tail -60

      - name: Extract SwiftUI PNGs
        run: |
          set -eo pipefail
          brew install xcparse || brew install chargepoint/xcparse/xcparse
          mkdir -p artifacts/swiftui "$RUNNER_TEMP/design-drift-attachments"
          xcparse attachments "$RUNNER_TEMP/DesignDriftSnapshots.xcresult" "$RUNNER_TEMP/design-drift-attachments"
          find "$RUNNER_TEMP/design-drift-attachments" -name '*.png' | while IFS= read -r f; do
            b=$(basename "$f"); cp "$f" "artifacts/swiftui/${b%%_*}.png"
          done
          test -n "$(find artifacts/swiftui -name '*.png' -print -quit)"

      - name: Figma export → artifacts/figma
        env:
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
        run: node tools/design-sync/export-figma.mjs artifacts/figma

      - name: Verify editable Figma structure
        env:
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
        run: node tools/design-sync/verify-figma-structure.mjs artifacts/figma-structure-report.json

      - name: Compare
        run: |
          cd tools/design-sync && npm ci
          cd "$GITHUB_WORKSPACE"
          node tools/design-sync/compare.mjs artifacts/swiftui artifacts/figma \
            --threshold=0.3 \
            --maxDiffRatio=0.10 \
            --require=Consent-default-light,Consent-terms-light,Consent-privacy-light

      - name: Finalize machine-readable comparison report
        if: always()
        env:
          DESIGN_DRIFT_JOB_STATUS: ${{ job.status }}
        run: |
          mkdir -p artifacts
          if [ ! -s artifacts/design-drift-report.json ]; then
            python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          report = {
              "version": 1,
              "status": "incomplete",
              "head": os.environ.get("GITHUB_SHA"),
              "jobStatus": os.environ.get("DESIGN_DRIFT_JOB_STATUS"),
              "reason": "An earlier design-drift step failed before comparison produced a report.",
              "checked": 0,
              "failed": 0,
              "skipped": 0,
              "errored": 0,
              "results": [],
          }
          Path("artifacts/design-drift-report.json").write_text(
              json.dumps(report, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
          fi
          if [ ! -s artifacts/figma-structure-report.json ]; then
            python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          report = {
              "version": 1,
              "status": "incomplete",
              "head": os.environ.get("GITHUB_SHA"),
              "reason": "An earlier design-drift step failed before Figma structure verification completed.",
              "errors": [],
          }
          Path("artifacts/figma-structure-report.json").write_text(
              json.dumps(report, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
          fi

      - name: Publish machine-readable comparison report
        if: always()
        run: |
          echo '## Design drift comparison' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat artifacts/design-drift-report.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo '## Figma structure' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat artifacts/figma-structure-report.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload comparison report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: design-drift-report
          path: |
            artifacts/design-drift-report.json
            artifacts/figma-structure-report.json
          if-no-files-found: error

      - name: Upload diffs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with: { name: design-diffs, path: artifacts/diff }
