name: agent-builder
on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number
        required: true
        type: string
permissions:
  actions: read
  contents: read
jobs:
  builder:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'agent:builder'
    uses: samuelalake/agent-factory/.github/workflows/builder.yml@aece3450ee38de6dc3ff64afe7151ff41cb37878
    with:
      issue: ${{ format('{0}', github.event.issue.number || inputs.issue) }}
      factory_ref: aece3450ee38de6dc3ff64afe7151ff41cb37878
      runner: ubuntu-latest
      base_ref: main
      app_id: ${{ vars.AGENT_FACTORY_BUILDER_APP_ID }}
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      FIGMA_MCP_OAUTH_BUNDLE: ${{ secrets.FIGMA_MCP_OAUTH_BUNDLE }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      AGENT_FACTORY_BUILDER_APP_ID: ${{ secrets.AGENT_FACTORY_BUILDER_APP_ID }}
      AGENT_FACTORY_BUILDER_APP_PRIVATE_KEY: ${{ secrets.AGENT_FACTORY_BUILDER_APP_PRIVATE_KEY }}
