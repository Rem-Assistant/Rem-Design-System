name: agent-builder
on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number
        required: true
        type: string
permissions:
  actions: read
  contents: read
jobs:
  builder:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'agent:builder'
    concurrency:
      group: rem-design-system-figma-writer
      cancel-in-progress: false
      queue: max
    uses: samuelalake/agent-factory/.github/workflows/builder.yml@32ad33d2110d4e63b883804bb2017514a796869d
    with:
      issue: ${{ format('{0}', github.event.issue.number || inputs.issue) }}
      factory_ref: 32ad33d2110d4e63b883804bb2017514a796869d
      runner: ubuntu-latest
      base_ref: main
      app_id: ${{ vars.AGENT_FACTORY_BUILDER_APP_ID }}
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      FIGMA_MCP_CLIENT_ID: ${{ secrets.FIGMA_MCP_CLIENT_ID }}
      FIGMA_MCP_CLIENT_SECRET: ${{ secrets.FIGMA_MCP_CLIENT_SECRET }}
      FIGMA_MCP_REFRESH_TOKEN: ${{ secrets.FIGMA_MCP_REFRESH_TOKEN }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      AGENT_FACTORY_BUILDER_APP_ID: ${{ secrets.AGENT_FACTORY_BUILDER_APP_ID }}
      AGENT_FACTORY_BUILDER_APP_PRIVATE_KEY: ${{ secrets.AGENT_FACTORY_BUILDER_APP_PRIVATE_KEY }}
