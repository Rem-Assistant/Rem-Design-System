name: agent-gate
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  pull_request_review:
    types: [submitted, edited, dismissed]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number
        required: true
        type: string
permissions:
  contents: read
  pull-requests: read
  issues: read
  statuses: write
jobs:
  gate:
    uses: samuelalake/agent-factory/.github/workflows/gate.yml@4cf1e5e84ad0a801f93720aa42ca813f4819fe97
    with:
      pr: ${{ format('{0}', github.event.pull_request.number || inputs.pr) }}
      factory_ref: 4cf1e5e84ad0a801f93720aa42ca813f4819fe97
    secrets: inherit
